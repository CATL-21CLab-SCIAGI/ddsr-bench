job_name: scicode-validation-vllm
jobs_dir: outputs/harbor
n_attempts: 1
n_concurrent_trials: 4

agents:
  - name: critpt_eval.benchmark.scicode.harbor:SciCodeAgent
    model_name: critpt-local
    include_logs: [response.json]
    extra_allowed_hosts: [127.0.0.1]
    kwargs:
      client_name: vllm
      base_url: http://127.0.0.1:8000/v1
      stream: true
      with_background: false
      sampling:
        max_tokens: 32768
        temperature: 0.0
        top_p: 1.0
        top_k: null
        seed: null
        reasoning_effort: low
        enable_thinking: null

datasets:
  - path: tasks/scicode-validation
