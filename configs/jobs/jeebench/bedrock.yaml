benchmark: jeebench
job_name: jeebench-bedrock
jobs_dir: outputs/harbor
n_attempts: 1
n_concurrent_trials: 8

agents:
  - name: jeebench
    model_name: global.openai.gpt-5.6-luna
    kwargs:
      client_name: bedrock
      base_url: https://bedrock-runtime.us-east-1.amazonaws.com/openai/v1
      api_key_env: AWS_BEARER_TOKEN_BEDROCK
      source_path: datasets/jeebench/official
      prompt_mode: cot # Official zero-shot chain-of-thought baseline.
      stream: false
      sampling:
        max_tokens: 2048
        temperature: 0.0
        top_p: 1.0

datasets:
  - path: tasks/jeebench/official
