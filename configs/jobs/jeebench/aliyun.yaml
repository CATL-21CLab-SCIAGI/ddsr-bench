benchmark: jeebench
job_name: jeebench-aliyun
jobs_dir: outputs/harbor
n_attempts: 1
n_concurrent_trials: 8

agents:
  - name: jeebench
    model_name: qwen3-max
    kwargs:
      client_name: openai
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key_env: DASHSCOPE_API_KEY
      source_path: datasets/jeebench/official
      prompt_mode: cot # Official zero-shot chain-of-thought baseline.
      stream: false
      sampling:
        max_tokens: 2048
        temperature: 0.0
        top_p: 1.0

datasets:
  - path: tasks/jeebench/official
