benchmark: prismphysics

# Evaluation layer: Harbor scheduling and result location.
job_name: prismphysics-text-openai
jobs_dir: outputs/harbor
n_attempts: 1
n_concurrent_trials: 4

# Generation layer: OPENAI_API_KEY is read from the environment.
agents:
  - name: ddsr_bench.benchmarks.prismphysics.evaluation.harbor:PRISMPhysicsAgent
    model_name: gpt-5.6-luna
    include_logs: [response.json]
    extra_allowed_hosts: [api.openai.com]
    kwargs:
      client_name: openai
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
      stream: true
      # Official text-only defaults: 8096 output tokens and low reasoning effort;
      # the OpenAI reasoning profile omits unsupported temperature fields.
      sampling:
        max_tokens: 8096
        reasoning_effort: low

# Dataset layer: optional Harbor tasks and static fallback.
datasets:
  - path: tasks/prismphysics
