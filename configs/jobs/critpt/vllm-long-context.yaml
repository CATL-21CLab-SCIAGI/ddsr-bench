benchmark: critpt

# Evaluation layer: static scheduling; run with ddsr-solve --config THIS_FILE.
# For Harbor, remove seed_base and set sampling.seed instead.
job_name: critpt-official-vllm-long-context
jobs_dir: outputs/harbor
n_attempts: 1
n_concurrent_trials: 4

# Generation layer: agent, client, prompt strategy, and request parameters.
# Qwen sampling example; the already running server must support these settings.
agents:
  - name: ddsr_bench.benchmarks.critpt.evaluation.harbor:CritPtAgent
    model_name: ddsr-local
    include_logs: [response.json]
    extra_allowed_hosts: [127.0.0.1]
    kwargs:
      client_name: vllm
      base_url: http://127.0.0.1:8000/v1
      style: two-step
      stream: true
      timeout: 7200
      # Requires /tokenize; caps each request to remaining server context.
      # This does not extend the model's configured context window.
      context_window: 262144
      context_safety_tokens: 32
      formatting_max_tokens: 131072
      seed_base: 42 # Stable per-problem, per-attempt seeds; static runner only.
      sampling:
        max_tokens: 262144
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        seed: null
        reasoning_effort: xhigh
        enable_thinking: null

# Dataset layer: normalized Harbor tasks.
datasets:
  - path: tasks/critpt-official
