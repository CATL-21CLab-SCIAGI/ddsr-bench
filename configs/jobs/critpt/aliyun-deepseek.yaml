benchmark: critpt

# Evaluation layer: static scheduling; run with ddsr-solve --config THIS_FILE.
# For Harbor, remove seed_base and set sampling.seed instead.
job_name: critpt-official-aliyun-deepseek
jobs_dir: outputs/harbor
n_attempts: 1
n_concurrent_trials: 4

# Generation layer: ALIYUN_API_KEY is read from the environment.
agents:
  - name: ddsr_bench.benchmarks.critpt.evaluation.harbor:CritPtAgent
    model_name: deepseek-v4-flash-0731
    include_logs: [response.json]
    extra_allowed_hosts: [cn-beijing.pai-token.aliyuncs.com]
    kwargs:
      client_name: aliyun
      base_url: https://cn-beijing.pai-token.aliyuncs.com/v1
      api_key_env: ALIYUN_API_KEY
      # This profile sends max_completion_tokens and omits temperature/top_p.
      request_profile: openai
      style: two-step
      stream: true
      timeout: 7200
      # Output budgets for derivation and formatting, not context-window sizes.
      formatting_max_tokens: 131072
      seed_base: 42 # Stable per-problem, per-attempt seeds; static runner only.
      sampling:
        max_tokens: 393216
        reasoning_effort: max

# Dataset layer: normalized Harbor tasks.
datasets:
  - path: tasks/critpt-official
