benchmark: critpt

# Evaluation layer: five attempts; run with ddsr-solve --config THIS_FILE.
# seed_base is static-only; for Harbor remove it and set sampling.seed instead.
job_name: deepseek-pai-max
jobs_dir: outputs/harbor
n_attempts: 5
n_concurrent_trials: 16

# Generation layer: retain the historical PAI_API_KEY environment variable.
agents:
  - name: ddsr_bench.benchmarks.critpt.evaluation.harbor:CritPtAgent
    model_name: deepseek-v4-flash-0731
    include_logs: [response.json]
    extra_allowed_hosts: [cn-beijing.pai-token.aliyuncs.com]
    kwargs:
      client_name: aliyun
      base_url: https://cn-beijing.pai-token.aliyuncs.com/v1
      api_key_env: PAI_API_KEY
      # Preserve the original request: max_completion_tokens; no temperature/top_p.
      request_profile: openai
      style: two-step
      stream: true
      timeout: 7200
      formatting_max_tokens: 131072
      require_complete_stages: false
      seed_base: 42
      sampling:
        max_tokens: 393216
        temperature: 1.0
        top_p: 1.0
        top_k: null
        seed: null
        reasoning_effort: max
        enable_thinking: null

# Dataset layer: normalized Harbor tasks.
datasets:
  - path: tasks/critpt-official
