benchmark: phybench

# Evaluation layer: Harbor scheduling and result location.
job_name: phybench-gradable-aliyun
jobs_dir: outputs/harbor
n_attempts: 1
n_concurrent_trials: 4

# Generation layer: ALIYUN_API_KEY is read from the environment.
agents:
  - name: ddsr_bench.benchmarks.phybench.evaluation.harbor:PHYBenchAgent
    # Text LLM examples: qwen3.8-max, deepseek-v4-pro, kimi-k2.7-code, glm-5.2.
    model_name: qwen3.8-max
    include_logs: [response.json]
    extra_allowed_hosts: [cn-beijing.pai-token.aliyuncs.com]
    kwargs:
      client_name: aliyun
      base_url: https://cn-beijing.pai-token.aliyuncs.com/v1
      api_key_env: ALIYUN_API_KEY
      stream: true
      # Official local settings, reused for reproducibility on this endpoint.
      sampling:
        max_tokens: 32768
        temperature: 0.6
        top_p: 0.95

# Dataset layer: Harbor tasks and static fallback.
datasets:
  - path: tasks/phybench
