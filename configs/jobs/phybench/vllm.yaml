benchmark: phybench

# Evaluation layer: Harbor scheduling and result location.
job_name: phybench-gradable
jobs_dir: outputs/harbor
n_attempts: 1
n_concurrent_trials: 4

# Generation layer: local OpenAI-compatible vLLM endpoint.
agents:
  - name: ddsr_bench.benchmarks.phybench.evaluation.harbor:PHYBenchAgent
    model_name: ddsr-local
    include_logs: [response.json]
    extra_allowed_hosts: [127.0.0.1]
    kwargs:
      client_name: vllm
      base_url: http://127.0.0.1:8000/v1
      stream: true
      # Official local settings from PHYBench arXiv 2504.16074v2, Section 4.1.
      sampling:
        max_tokens: 32768
        temperature: 0.6
        top_p: 0.95
        top_k: null
        seed: null
        reasoning_effort: null
        enable_thinking: null

# Dataset layer: Harbor tasks and static fallback.
datasets:
  - path: tasks/phybench
