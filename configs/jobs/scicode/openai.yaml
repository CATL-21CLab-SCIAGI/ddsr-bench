# Evaluation layer: Harbor scheduling and result location.
job_name: scicode-validation-openai
jobs_dir: outputs/harbor
n_attempts: 1
n_concurrent_trials: 4

# Generation layer: OPENAI_API_KEY is read from the environment.
agents:
  - name: ddsr_bench.benchmarks.scicode.evaluation.harbor:SciCodeAgent
    model_name: gpt-5.6-luna
    include_logs: [response.json]
    extra_allowed_hosts: [api.openai.com]
    kwargs:
      client_name: openai
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
      stream: true
      with_background: false
      sampling:
        max_tokens: 8192
        reasoning_effort: low

datasets:
  - path: tasks/scicode-validation
