benchmark: olympiadbench

job_name: olympiadbench-official-openai
jobs_dir: outputs/harbor
n_attempts: 1
n_concurrent_trials: 8

agents:
  - name: olympiadbench
    model_name: gpt-5.6-luna
    kwargs:
      client_name: openai
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
      stream: false
      include_images: true
      sampling:
        max_tokens: 2048
        temperature: 0.0
        top_p: 1.0

datasets:
  - path: tasks/olympiadbench/official
