benchmark: olympiadbench

job_name: olympiadbench-official-bedrock
jobs_dir: outputs/harbor
n_attempts: 1
n_concurrent_trials: 8

agents:
  - name: olympiadbench
    model_name: global.openai.gpt-5.6-luna
    kwargs:
      client_name: bedrock
      base_url: https://bedrock-runtime.us-east-1.amazonaws.com/openai/v1
      api_key_env: AWS_BEARER_TOKEN_BEDROCK
      stream: false
      include_images: true
      sampling:
        max_tokens: 2048
        temperature: 0.0
        top_p: 1.0

datasets:
  - path: tasks/olympiadbench/official
