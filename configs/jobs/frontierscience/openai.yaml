benchmark: frontierscience

job_name: frontierscience-gold-openai
jobs_dir: outputs/harbor
n_attempts: 1
n_concurrent_trials: 10

agents:
  - name: frontierscience
    model_name: gpt-5.6-luna
    kwargs:
      client_name: openai
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
      stream: false
      sampling:
        max_tokens: 32768
        temperature: null
        top_p: null
      judge:
        client_name: openai
        base_url: https://api.openai.com/v1
        api_key_env: OPENAI_API_KEY
        # The paper specifies GPT-5 with high reasoning effort.
        model: gpt-5
        sampling:
          reasoning_effort: high

datasets:
  - path: tasks/frontierscience/gold
