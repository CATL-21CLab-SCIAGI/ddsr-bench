benchmark: frontierscience

job_name: frontierscience-gold-bedrock
jobs_dir: outputs/harbor
n_attempts: 1
n_concurrent_trials: 10

agents:
  - name: frontierscience
    model_name: global.openai.gpt-5.6-luna
    kwargs:
      client_name: bedrock
      base_url: https://bedrock-runtime.us-east-1.amazonaws.com/openai/v1
      api_key_env: AWS_BEARER_TOKEN_BEDROCK
      stream: false
      sampling:
        max_tokens: 32768
        temperature: null
        top_p: null
      judge:
        client_name: bedrock
        base_url: https://bedrock-runtime.us-east-1.amazonaws.com/openai/v1
        api_key_env: AWS_BEARER_TOKEN_BEDROCK
        # Provider substitution; not directly comparable with the paper judge.
        model: global.openai.gpt-5.6-luna
        sampling:
          reasoning_effort: high

datasets:
  - path: tasks/frontierscience/gold
