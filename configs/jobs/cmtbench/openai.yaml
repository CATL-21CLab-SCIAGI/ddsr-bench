benchmark: cmtbench

# Evaluation layer: Harbor scheduling and result location.
job_name: cmtbench-v2-openai
jobs_dir: outputs/harbor
n_attempts: 1
n_concurrent_trials: 4

# Generation layer: OPENAI_API_KEY is read from the environment.
agents:
  - name: ddsr_bench.benchmarks.cmtbench.evaluation.harbor:CMTBenchAgent
    model_name: gpt-5.6-luna
    include_logs: [response.json]
    extra_allowed_hosts: [api.openai.com]
    kwargs:
      client_name: openai
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
      stream: true
      # Upstream uses provider defaults. DDSR explicitly caps output and selects
      # low reasoning for this configured reasoning model.
      sampling:
        max_tokens: 8192
        reasoning_effort: low

# Dataset layer: optional Harbor tasks and static fallback.
datasets:
  - path: tasks/cmtbench
