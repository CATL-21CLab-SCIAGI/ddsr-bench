name: critpt
source: critpt-official # Official CritPt repository, or critpt-ai for an AI corpus.
submission:
  # Submission destination, not the container provider:
  # official -> Artificial Analysis API; uses endpoint/api_key_env/timeout_sec.
  # internal defaults -> consensus for official data; AI judge for critpt-ai data.
  # Both grade saved, collected answers without generating new responses.
  backend: official
  grader: null # Default routing; internal overrides: consensus, ai (task defaults), rule, llm.
  # Overrides require compatible references. Official supports only its fixed AA grader.
  # Internal grading selects the source from collected trials, not benchmark.source.
  datasets: null # Reuse saved job datasets; override with [{path: /relocated/tasks}].
  attempts: null # Official: [0, 1, 2, 3, 4] combines 350 answers in one request.
  # Internal: the same selection reuses one grader/cache and reports aggregate means.
  # Integers become lists; lists are sorted and duplicate indices are rejected.
  # A pending official submission blocks retries until its AA outcome is reconciled.
  endpoint: https://artificialanalysis.ai/api/v2/critpt/evaluate
  api_key_env: ARTIFICIAL_ANALYSIS_API_KEY
  timeout_sec: 7200
  ai:
    # Task graders are defaults; submission.grader may override. This sets the client.
    llm: {} # SemanticJudgeConfig overrides (model, endpoint, timeout, etc.).
    resources: ${harbor} # Rule worker image, cpus, memory_mb, timeout_sec; no host fallback.
    llm_fallback: false # Allow LLM equivalence checking when deterministic grading is inconclusive.
    # Rules run in fresh containers; LLM tasks always use the semantic judge.
    # Reports stay private and never change generation rewards or trajectories.
  consensus:
    references: ??? # Required for consensus grading; supply a private reference JSON path.
    cache_dir: ${paths.output}/cache/critpt-consensus # Private reference outputs; null disables disk reuse.
    # docker: fresh worker containers managed by Harbor's Docker environment.
    execution: docker # Normal submission has no Linux/host execution fallback.
    resources: ${harbor} # Same image, cpus, memory_mb, timeout_sec as AI workers (120s default).
    jobs: 4 # Concurrent problems (1–16); e.g. override to 8 if resources permit.
    # Each problem runs its workers sequentially; resources apply per worker.
    # This setting is independent of generation/Harbor trial concurrency.
