[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ddsr-bench"
version = "0.1.0"
description = "Evaluation and data framework for data-driven scientific reasoning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "harbor==0.22.0",
    "httpx>=0.27,<1",
    "hydra-core>=1.3,<1.4",
    "jinja2>=3.1,<4",
    "numpy>=1.26,<3",
    "pyyaml>=6,<7",
    "scipy>=1.13,<2",
    "sympy>=1.13,<2",
]

[project.optional-dependencies]
dev = ["black>=24", "pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]
scicode = [
    "datasets>=4,<6",
    "h5py>=3,<4",
]

[project.scripts]
ddsr-bench = "ddsr_bench.commands.dispatch:main"
ddsr-solve = "ddsr_bench.commands.solve:main"
ddsr-smoke = "ddsr_bench.commands.smoke:main"
ddsr-vllm = "ddsr_bench.commands.serve:main"

[tool.setuptools]
packages = [
    "ddsr_bench",
    "ddsr_bench.benchmarks",
    "ddsr_bench.benchmarks.critpt",
    "ddsr_bench.benchmarks.scicode",
    "ddsr_bench.commands",
    "ddsr_bench.generation",
    "ddsr_bench.grading",
    "ddsr_bench.training",
    "configs",
]

[tool.setuptools.package-data]
"ddsr_bench.benchmarks.scicode" = ["fixed/*.txt"]
configs = [
    "*.yaml",
    "benchmark/*.yaml",
    "harbor/*.yaml",
    "jobs/critpt/*.yaml",
    "jobs/scicode/*.yaml",
    "prompts/critpt/*.yaml",
    "prompts/scicode/*.txt",
    "serving/vllm/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
