[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ddsr-bench"
version = "0.1.0"
description = "Evaluation and data framework for data-driven scientific reasoning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "harbor==0.22.0",
    "httpx>=0.27,<1",
    "hydra-core>=1.3,<1.4",
    "jinja2>=3.1,<4",
    "mpmath>=1.3,<2",
    "pydantic>=2.10,<3",
    "numpy>=1.26,<3",
    "pyyaml>=6,<7",
    "scipy>=1.13,<2",
    "sympy>=1.13,<2",
]

[project.optional-dependencies]
cmtbench = [
    "datasets>=4,<6",
    "numpy==2.2.5",
    "regex==2024.11.6",
    "sympy==1.13.3",
]
cmphysbench = [
    "datasets>=4,<6",
    "latex2sympy2-extended>=1.11,<2",
    "pint>=0.26,<1",
    "timeout-decorator>=0.5,<1",
]
dev = ["black>=24", "docker>=7,<8", "pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]
phybench = [
    "datasets>=4,<6",
    "latex2sympy2-extended>=1.11,<2",
    "timeout-decorator>=0.5,<1",
]
physics = ["datasets>=4,<6"]
hle = ["datasets>=4,<6", "huggingface-hub>=0.27,<2"]
prismphysics = [
    "huggingface-hub>=0.27,<2",
    "latex2sympy2-extended>=1.11,<2",
    "regex>=2024.11,<2027",
]
scicode = [
    "h5py>=3,<4",
    "huggingface-hub>=0.27,<2",
]

[project.scripts]
ddsr-bench = "ddsr_bench.commands.dispatch:main"
ddsr-solve = "ddsr_bench.commands.solve:main"
ddsr-smoke = "ddsr_bench.commands.smoke:main"
ddsr-critpt-consensus = "ddsr_bench.benchmarks.critpt.evaluation.consensus.cli:main"
ddsr-vllm = "ddsr_bench.commands.serve:main"

[tool.setuptools]
packages = [
    "ddsr_bench",
    "ddsr_bench.benchmarks",
    "ddsr_bench.benchmarks.cmtbench",
    "ddsr_bench.benchmarks.cmtbench.data",
    "ddsr_bench.benchmarks.cmtbench.evaluation",
    "ddsr_bench.benchmarks.cmtbench.evaluation.scorer",
    "ddsr_bench.benchmarks.cmtbench.generation",
    "ddsr_bench.benchmarks.cmphysbench",
    "ddsr_bench.benchmarks.cmphysbench.data",
    "ddsr_bench.benchmarks.cmphysbench.evaluation",
    "ddsr_bench.benchmarks.cmphysbench.evaluation.seed",
    "ddsr_bench.benchmarks.cmphysbench.generation",
    "ddsr_bench.benchmarks.phybench",
    "ddsr_bench.benchmarks.phybench.data",
    "ddsr_bench.benchmarks.phybench.evaluation",
    "ddsr_bench.benchmarks.phybench.evaluation.eed",
    "ddsr_bench.benchmarks.phybench.generation",
    "ddsr_bench.benchmarks.physics",
    "ddsr_bench.benchmarks.physics.data",
    "ddsr_bench.benchmarks.physics.evaluation",
    "ddsr_bench.benchmarks.physics.generation",
    "ddsr_bench.benchmarks.hle",
    "ddsr_bench.benchmarks.hle.data",
    "ddsr_bench.benchmarks.hle.evaluation",
    "ddsr_bench.benchmarks.hle.generation",
    "ddsr_bench.benchmarks.prismphysics",
    "ddsr_bench.benchmarks.prismphysics.data",
    "ddsr_bench.benchmarks.prismphysics.evaluation",
    "ddsr_bench.benchmarks.prismphysics.evaluation.gradephyx",
    "ddsr_bench.benchmarks.prismphysics.generation",
    "ddsr_bench.benchmarks.critpt",
    "ddsr_bench.benchmarks.critpt.data",
    "ddsr_bench.benchmarks.critpt.evaluation",
    "ddsr_bench.benchmarks.critpt.evaluation.ai",
    "ddsr_bench.benchmarks.critpt.evaluation.ai.io",
    "ddsr_bench.benchmarks.critpt.evaluation.ai.llm",
    "ddsr_bench.benchmarks.critpt.evaluation.ai.llm.clients",
    "ddsr_bench.benchmarks.critpt.evaluation.ai.rule",
    "ddsr_bench.benchmarks.critpt.submission",
    "ddsr_bench.benchmarks.critpt.evaluation.consensus",
    "ddsr_bench.benchmarks.critpt.evaluation.consensus.matching",
    "ddsr_bench.benchmarks.critpt.evaluation.consensus.execution",
    "ddsr_bench.benchmarks.critpt.generation",
    "ddsr_bench.benchmarks.scicode",
    "ddsr_bench.benchmarks.scicode.data",
    "ddsr_bench.benchmarks.scicode.evaluation",
    "ddsr_bench.benchmarks.scicode.generation",
    "ddsr_bench.commands",
    "ddsr_bench.generation",
    "ddsr_bench.training",
    "configs",
]

[tool.setuptools.package-data]
"ddsr_bench.benchmarks.critpt.evaluation.ai" = ["LICENSE", "UPSTREAM.md"]
"ddsr_bench.benchmarks.cmphysbench.evaluation.seed" = ["LICENSE", "NOTICE.md"]
"ddsr_bench.benchmarks.phybench.evaluation.eed" = ["LICENSE", "NOTICE.md"]
"ddsr_bench.benchmarks.prismphysics.evaluation.gradephyx" = ["LICENSE", "NOTICE.md"]
"ddsr_bench.benchmarks.scicode.data" = ["fixed/*.txt"]
configs = [
    "*.yaml",
    "benchmark/*.yaml",
    "harbor/*.yaml",
    "jobs/cmtbench/*.yaml",
    "jobs/critpt/*.yaml",
    "jobs/cmphysbench/*.yaml",
    "jobs/phybench/*.yaml",
    "jobs/physics/*.yaml",
    "jobs/hle/*.yaml",
    "jobs/prismphysics/*.yaml",
    "jobs/scicode/*.yaml",
    "prompts/critpt/*.yaml",
    "prompts/cmtbench/*.txt",
    "prompts/cmphysbench/*.txt",
    "prompts/phybench/*.txt",
    "prompts/physics/*.txt",
    "prompts/hle/*.txt",
    "prompts/prismphysics/*.txt",
    "prompts/scicode/*.txt",
    "serving/vllm/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"ddsr_bench/benchmarks/cmphysbench/evaluation/seed/*.py" = ["ALL"]
"ddsr_bench/benchmarks/phybench/evaluation/eed/*.py" = ["ALL"]
"ddsr_bench/benchmarks/prismphysics/evaluation/gradephyx/*.py" = ["ALL"]

"ddsr_bench/benchmarks/critpt/evaluation/ai/grader.py" = ["BLE001"]
"ddsr_bench/benchmarks/critpt/evaluation/ai/llm/clients/bedrock.py" = ["SIM117", "TRY004"]
"ddsr_bench/benchmarks/critpt/evaluation/ai/llm/equivalence.py" = ["C408", "UP037"]
"ddsr_bench/benchmarks/critpt/evaluation/ai/llm/clients/openai.py" = ["UP037", "UP041"]
"ddsr_bench/benchmarks/critpt/evaluation/ai/llm/utils.py" = ["TRY201"]
"ddsr_bench/benchmarks/critpt/evaluation/ai/llm/semantic.py" = ["BLE001", "UP037"]
"ddsr_bench/benchmarks/critpt/evaluation/ai/llm/clients/config.py" = ["TRY004"]
"ddsr_bench/benchmarks/critpt/evaluation/ai/answer.py" = ["S102", "TRY004"]
"ddsr_bench/benchmarks/critpt/evaluation/ai/runtime.py" = ["BLE001"]
"ddsr_bench/benchmarks/critpt/evaluation/ai/validation.py" = ["SIM101", "SIM102", "TRY004"]
"ddsr_bench/benchmarks/critpt/evaluation/ai/rule/numeric.py" = ["BLE001", "FURB136"]
"ddsr_bench/benchmarks/critpt/evaluation/ai/rule/symbolic.py" = ["BLE001", "S110"]
