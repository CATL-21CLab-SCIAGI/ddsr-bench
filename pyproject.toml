[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "critpt-eval"
version = "0.1.0"
description = "Minimal CritPt generation and evaluation harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "harbor==0.22.0",
    "httpx>=0.27,<1",
    "hydra-core>=1.3,<1.4",
    "jinja2>=3.1,<4",
    "numpy>=1.26,<3",
    "pyyaml>=6,<7",
    "scipy>=1.13,<2",
    "sympy>=1.13,<2",
]

[project.optional-dependencies]
dev = ["black>=24", "pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]
scicode = [
    "datasets>=4,<6",
    "h5py>=3,<4",
]

[project.scripts]
critpt-eval = "critpt_eval.commands.dispatch:main"
critpt-solve = "critpt_eval.commands.solve:main"
critpt-smoke = "critpt_eval.commands.smoke:main"
critpt-vllm = "critpt_eval.commands.serve:main"

[tool.setuptools]
packages = [
    "critpt_eval",
    "critpt_eval.benchmark",
    "critpt_eval.benchmark.scicode",
    "critpt_eval.commands",
    "critpt_eval.generation",
    "critpt_eval.grading",
    "critpt_eval.loaders",
    "critpt_eval.training",
    "configs",
]

[tool.setuptools.package-data]
"critpt_eval.benchmark.scicode" = ["fixed/*.txt"]
configs = [
    "*.yaml",
    "benchmark/*.yaml",
    "harbor/*.yaml",
    "job/*.yaml",
    "prompt/*.yaml",
    "prompt/scicode/*.txt",
    "vllm/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
